spring.application.name=glowgraph
server.port=8090

# Optional import of local configuration containing credentials (ignored by Git)
spring.config.import=optional:classpath:application-local.properties

# Production connection details read from environment variables
spring.neo4j.uri=${COGNODB_URI}
spring.neo4j.authentication.username=${COGNODB_USERNAME}
spring.neo4j.authentication.password=${COGNODB_PASSWORD}